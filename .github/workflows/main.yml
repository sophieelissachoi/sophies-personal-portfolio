name: Set Up Deployment
on: [push]
jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sophies-personal-portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: sophies-personal-portfolio/package-lock.json
